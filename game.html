<button id="qr-btn" style="position:fixed;top:12px;right:12px;background:#231F20;color:#fff;border:0;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;z-index:99">QR Mode</button>
<div id="qr-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;color:#231F20;padding:24px;border-radius:16px;max-width:360px;width:100%;text-align:center">
    <h3 style="margin:0 0 10px">Scan to Play</h3>
    <input id="qr-url" type="url" placeholder="Paste https://... URL here" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-bottom:14px">
    <div id="qr-box" style="margin:10px auto"></div>
    <button onclick="document.getElementById('qr-modal').style.display='none'" style="margin-top:12px;padding:8px 16px;border:0;border-radius:8px;background:#EE4B3B;color:#fff;cursor:pointer">Close</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
document.getElementById('qr-btn').onclick=()=>{document.getElementById('qr-modal').style.display='flex';};
document.getElementById('qr-url').oninput=(e)=>{
  const box=document.getElementById('qr-box'); box.innerHTML='';
  if(e.target.value.startsWith('http')) new QRCode(box,{text:e.target.value,width:220,height:220});
};
</script>
